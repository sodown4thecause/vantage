version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    ignore:
      # Next 16.4 crashes @opennextjs/cloudflare 1.20.x at startup (preview-props.json manifest, error 1101). Remove once OpenNext supports 16.4.
      - dependency-name: "next"
        versions: [">=16.4.0"]
      - dependency-name: "eslint-config-next"
        versions: [">=16.4.0"]
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      cloudflare:
        patterns: ["wrangler", "@opennextjs/cloudflare"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    groups:
      actions:
        patterns: ["*"]
