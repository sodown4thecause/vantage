name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders only. The build must not need real secrets.
      DATABASE_URL: postgresql://user:pass@localhost:5432/vantage
      NEON_AUTH_BASE_URL: https://example.invalid/auth
      NEON_AUTH_COOKIE_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: |
          pnpm test
          node --test test/worker-entry.test.mjs test/scan-run.test.mjs test/queue-consumer.test.mjs
      - name: Check migration drift
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle
      - name: Build
        run: pnpm build

  workers-build:
    # No secrets or placeholder env on purpose: this job fails if the Worker
    # build ever starts needing DATABASE_URL or NEON_AUTH_* again.
    name: Cloudflare Worker bundle (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify no secrets are present
        run: |
          if [ -n "${NEON_AUTH_BASE_URL:-}" ] || [ -n "${NEON_AUTH_COOKIE_SECRET:-}" ] || [ -n "${DATABASE_URL:-}" ]; then
            echo "This job must run without database or auth secrets."
            exit 1
          fi
      - name: Build Cloudflare Worker bundle
        run: pnpm cf:build
      - name: Test blog routes in Cloudflare Worker runtime
        run: pnpm test:blog-worker
      - name: Smoke test built Worker (wrangler dev)
        run: pnpm cf:smoke
      - name: Validate complete Worker upload (dry run)
        run: pnpm exec wrangler deploy --dry-run --env staging --outdir .wrangler/audit-bundle
      # .open-next/worker.js is only the ~2 KB entry shim; wrangler bundles it
      # into the modules under .wrangler/audit-bundle, which are what uploads.
      # Sum every uploaded module (the dry run also writes source maps, which
      # are not uploaded, and a README) so a future wasm or chunk module cannot
      # grow past the limit unnoticed. Cloudflare counts the compressed script
      # size against the 10 MB paid limit.
      - name: Check Worker size (10 MB compressed paid-plan limit)
        run: |
          dir=.wrangler/audit-bundle
          raw=0
          gz=0
          files=0
          while IFS= read -r file; do
            raw=$((raw + $(stat -c%s "$file")))
            gz=$((gz + $(gzip -c "$file" | wc -c)))
            files=$((files + 1))
          done < <(find "$dir" -type f ! -name '*.map' ! -name 'README.md')
          echo "$files module(s): raw $raw bytes ($((raw / 1024)) KiB), gzip $gz bytes ($((gz / 1024)) KiB), limit 10485760"
          if [ "$files" -eq 0 ]; then
            echo "::error::No uploaded modules found under $dir; the size gate cannot pass without a bundle"
            exit 1
          fi
          if [ "$gz" -gt 10485760 ]; then
            echo "::error::The Worker upload is over the 10 MB compressed script limit"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: worker-bundle
          path: .wrangler/audit-bundle
          retention-days: 7
