name: Deploy

# Staging deploys automatically after CI passes on main.
# Production deploys only when run manually (Actions > Deploy > Run workflow).
# Add required reviewers to the "production" environment in
# Settings > Environments for an approval gate.
#
# Required secrets (Settings > Secrets and variables > Actions, or per environment):
#   CLOUDFLARE_API_TOKEN   - token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID
#   DATABASE_URL           - only needed if you tick "run migrations"
# Runtime secrets (CRON_SECRET, NEON_AUTH_COOKIE_SECRET, DATABASE_URL) stay in
# Cloudflare via `wrangler secret put`, as described in the README.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      run_migrations:
        description: Run `pnpm db:migrate` before deploying (deliberate step, see README)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TARGET_ENV: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets before deploying."
            exit 1
          else
            echo "::notice::Cloudflare secrets not set yet, skipping automatic staging deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.ok == 'true'

      - name: Run database migrations
        if: steps.creds.outputs.ok == 'true' && github.event.inputs.run_migrations == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set for the $TARGET_ENV environment"
            exit 1
          fi
          pnpm db:migrate

      - name: Build Cloudflare Worker bundle
        if: steps.creds.outputs.ok == 'true'
        run: pnpm cf:build

      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy --env ${{ env.TARGET_ENV }}
