version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/node:22.14.0
    resource_class: medium
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://user:pass@localhost:5432/vantage
      NEON_AUTH_BASE_URL: https://example.invalid/auth
      NEON_AUTH_COOKIE_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - checkout
      - run:
          name: Activate pnpm 11.5.0
          command: |
            corepack enable
            corepack prepare pnpm@11.5.0 --activate
            pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - v1-pnpm-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Typecheck
          command: pnpm typecheck
      - run:
          name: Test
          command: pnpm test
      - run:
          name: Check migration drift
          command: |
            pnpm db:generate
            git diff --exit-code -- drizzle
      - run:
          name: Build
          command: pnpm build

workflows:
  verify:
    jobs:
      - verify
