version: 2.1

commands:
  restore_node_modules:
    steps:
      - restore_cache:
          keys:
            - v1-pnpm-node-{{ checksum "pnpm-lock.yaml" }}
            - v1-pnpm-node-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: v1-pnpm-node-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
            - node_modules

jobs:
  verify:
    docker:
      - image: cimg/node:22.14.0
    resource_class: medium
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://user:pass@localhost:5432/vantage
      NEON_AUTH_BASE_URL: https://example.invalid/auth
      NEON_AUTH_COOKIE_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - checkout
      - run:
          name: Activate pnpm 11.5.0
          command: |
            corepack enable
            corepack prepare pnpm@11.5.0 --activate
            pnpm config set store-dir ~/.pnpm-store
      - restore_node_modules
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Typecheck
          command: pnpm typecheck
      - run:
          name: Test
          command: pnpm test
      - run:
          name: Check migration drift
          command: |
            pnpm db:generate
            git diff --exit-code -- drizzle
      - run:
          name: Build
          command: pnpm build

  # No `environment:` block on purpose. Nothing here may inherit secrets, so this
  # job fails if the build ever needs NEON_AUTH_* again. Worker script limits are
  # 3 MB (Free) and 10 MB (Paid), so the bundle is measured and gated here.
  workers-build:
    docker:
      - image: cimg/node:22.14.0
    resource_class: medium
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - checkout
      - run:
          name: Activate pnpm 11.5.0
          command: |
            corepack enable
            corepack prepare pnpm@11.5.0 --activate
            pnpm config set store-dir ~/.pnpm-store
      - restore_node_modules
      - run:
          name: Lint and typecheck
          command: |
            pnpm lint
            pnpm typecheck
      - run:
          name: Build Cloudflare Worker bundle
          command: pnpm cf:build
      - run:
          name: Verify no secrets were required
          command: |
            if [ -n "${NEON_AUTH_BASE_URL:-}" ] || [ -n "${NEON_AUTH_COOKIE_SECRET:-}" ] || [ -n "${DATABASE_URL:-}" ]; then
              echo "This job must run without database or auth secrets."
              exit 1
            fi
            echo "Built with no secrets in the environment."
      - run:
          name: Check Worker bundle size
          command: |
            set -e
            WORKER=.open-next/worker.js
            test -f "$WORKER" || { echo "missing $WORKER"; exit 1; }
            SIZE=$(wc -c < "$WORKER")
            MB=$(awk "BEGIN{printf \"%.2f\", $SIZE/1048576}")
            echo "worker bundle: $SIZE bytes ($MB MB)"
            FREE_LIMIT=3145728
            PAID_LIMIT=10485760
            if [ "$SIZE" -gt "$PAID_LIMIT" ]; then
              echo "FAIL: $MB MB exceeds the 10 MB Workers Paid limit."
              exit 1
            fi
            if [ "$SIZE" -gt "$FREE_LIMIT" ]; then
              echo "WARN: $MB MB exceeds the 3 MB Free limit; Workers Paid is required."
            else
              echo "OK: fits the 3 MB Workers Free limit."
            fi
      - store_artifacts:
          path: .open-next/worker.js
          destination: worker-bundle

workflows:
  verify:
    jobs:
      - verify
      - workers-build
