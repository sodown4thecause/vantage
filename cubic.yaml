# Configures AI review behavior. See https://docs.cubic.dev/configure/cubic-yaml
# Reviews cover actual code changes only; docs and reviewer config files are
# skipped so docs-only PRs do not wait on reviewer latency.
# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

version: 1
reviews:
  enabled: true
  incremental_commits: true
  sensitivity: medium
  ignore:
    files:
      - '**/*.md'
      - 'docs/**'
      - '.greptile/**'
      - 'greptile.json'
      - 'cubic.yaml'
      - 'pnpm-lock.yaml'
